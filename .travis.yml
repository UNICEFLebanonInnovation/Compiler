os: linux

# Target a modern Ubuntu image compatible with Python 3.10+ and Docker.
dist: jammy

language: python

python:
  - "3.11"

services:
  - docker

cache:
  pip: true

install:
  - python -m pip install --upgrade pip
  - pip install coveralls codecov django-coverage-plugin

script:
  - docker-compose -f test.yml run --rm django

after_success:
  - coveralls
  - codecov
  - |
      if [[ "${TRAVIS_BRANCH}" == "develop" || "${TRAVIS_BRANCH}" == "master" ]]; then
        docker login -u "${DOCKER_USER}" -p "${DOCKER_PASS}";
        docker tag compiler_django "${DOCKER_USER}/${DOCKER_REPO}:${TRAVIS_BRANCH}";
        docker push "${DOCKER_USER}/${DOCKER_REPO}:${TRAVIS_BRANCH}";
      fi

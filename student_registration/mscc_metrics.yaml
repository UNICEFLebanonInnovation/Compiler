# --- Dropout Rate (from MV) ---
- key: mscc_dropout_rate
  label: Dropout Rate
  description: Share of registrations that dropped out in the selected period.
  sql_view: mv_mscc_dropout_rate_monthly
  value_column: rate_pct
  default_time_column: month
  unit: percent
  allowed_breakdowns:
    - none
    - month
    - governorate
    - partner_id
    - cycle
    - child_gender
    - child_gender_norm
    - age_band
  allowed_filters:
    - governorate
    - partner_id
    - cycle
    - child_gender
    - child_gender_norm
    - age_band
  decimals: 1
  rounding: 1          # must be one of 1,2,5,10,20,50,100
  min_sample_size: 30
  freshness_sla_minutes: 60
  tags: [mscc, dropout, rate]


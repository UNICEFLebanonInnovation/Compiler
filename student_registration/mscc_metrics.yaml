# apps/metrics/seeds/mscc_metrics.yaml
# Covers: registrations, education status/program, dropouts, outreach, digital usage, attendance, age/gender
# Time columns:
#   - monthly MVs: month
#   - age/gender pyramid: year

##############################################################################
# REGISTRATIONS (TOTALS & BREAKDOWNS)
##############################################################################
- key: mscc_registrations_total
  label: MSCC Registrations (Total)
  description: Count of child registrations in the selected period.
  sql_view: mv_mscc_registrations_monthly
  value_column: value
  default_time_column: month
  unit: registrations
  allowed_breakdowns:
    - none
    - month
    - governorate
    - caza
    - cadaster
    - child_gender
    - child_gender_norm
    - child_nationality_name
    - partner_id
    - center_type
    - cycle
    - round_id
    - age_band
  allowed_filters:
    - governorate
    - caza
    - cadaster
    - child_gender
    - child_gender_norm
    - child_nationality_name
    - partner_id
    - center_type
    - cycle
    - round_id
    - age_band
  decimals: 0
  min_sample_size: 15
  rounding: 5
  freshness_sla_minutes: 60
  tags: [mscc, volume]


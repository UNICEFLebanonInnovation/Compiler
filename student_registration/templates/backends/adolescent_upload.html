{% extends "base.html" %}
{% load staticfiles i18n %}

{% block content-full-page %}
<section>
    <section id="page-title" class="inline-form inner-section ui-menu-color02">
        <div class="container-fluid nopadding">
            <h3 class="font-accident-two-light color01 uppercase" data-animation-origin="right" data-animation-duration="400" data-animation-delay="100" data-animation-distance="50px">{% trans "Upload Adolescent Data" %}</h3>
        </div>
    </section>
    <section style="padding-top:10px;">
        {% if error %}<p class="text-danger">{{ error }}</p>{% endif %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="file" required class="form-control"/>
            <button type="submit" class="btn btn-primary" style="margin-top:10px;">{% trans "Upload" %}</button>
        </form>
    </section>
</section>
{% endblock %}

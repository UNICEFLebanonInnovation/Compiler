{% extends "base2.html" %}

{% block main_content %}

    <section class="container-fluid" data-section="home">
      <!-- Personal Flexy Section -->
      <div class="row flex-row">
         <!-- Personal Details 02 -->
         <div id="personal-2" class="col-md-8 flex-column ui-block-color01 light nopadding"
              data-animation-origin="right"
              data-animation-duration="300"
              data-animation-delay="600"
              data-animation-distance="200px">
            <div class="row flex-panel nopadding">
               <div class="col-md-16 nopadding">
                  <div class="row flex-row nopadding">
                  </div>
               </div>
               <div class="col-md-12 nopadding">
                  <div class="row flex-row nopadding">
                  </div>
               </div>
               <div class="col-md-12 nopadding">
                  <div class="row flex-row nopadding">
                    <a href="{% url 'clm:bridging_list' %}" class="col-md-6 flex-column bg-color03 p-grid-item nopadding hvr-bounce-to-top hvr-green">
                        <div class="flex-panel padding-44">
                           <div class="p-icon green"></div>
                           <span class="uppercase">Dirasa</span>
                           <p class="">Dirasa</p>
                        </div>
                     </a>
                     <a href="{% url 'clm:attendance' %}" class="col-md-6 flex-column bg-color03 p-grid-item nopadding hvr-bounce-to-top hvr-blue">
                        <div class="flex-panel padding-44">
                           <div class="p-icon blue"></div>
                           <span class="uppercase">Attendance</span>
                           <p class="">Attendance</p>
                        </div>
                     </a>

                  </div>
               </div>
               <div class="col-md-12 nopadding">
                  <div class="row flex-row nopadding">
                    <a href="{% url 'schools:school_list' %}" class="col-md-6 flex-column bg-color03 p-grid-item nopadding hvr-bounce-to-top hvr-red">
                        <div class="flex-panel padding-44">
                           <div class="p-icon red"></div>
                           <span class="uppercase">Schools</span>
                           <p class="">Schools</p>
                        </div>
                     </a>
                   <a href="{% url 'students:teacher_list' %}" class="col-md-6 flex-column bg-color03 p-grid-item nopadding hvr-bounce-to-top hvr-red">
                        <div class="flex-panel padding-44">
                           <div class="p-icon red"></div>
                           <span class="uppercase">Teachers</span>
                           <p class="">Teachers</p>
                        </div>
                     </a>
                  </div>
               </div>

            </div>
         </div>
         <!-- /Personal Details 02 -->
         <!-- Personal Details 01 -->
         <div id="details" class="col-md-4 flex-column bg-color01 light nopadding"
              data-animation-origin="left"
              data-animation-duration="300"
              data-animation-delay="400"
              data-animation-distance="200px">
            <div class="padding-50 flex-panel">
               <div class="row row-no-padding">
                  <div class="col-md-12 nopadding">
                     <h3 class="font-accident-two-normal">Welcome to the Dirasa Programme!</h3>
                     <div class="quote">
                        <div class="dividewhite3"></div>
                     </div>
                  </div>
               </div>
               <div class="divider-dynamic"></div>
            </div>
         </div>
         <!-- /Personal Details 01 -->
      </div>
      <!-- /Personal Flexy Section -->
   </section>

   <section id="professional" class="container-fluid" data-section="home">
      <div class="row flex-row">
         <div id="pro-experience" class="col-md-4 flex-column dark nopadding ui-block-color02 flex-col"
              data-animation-origin="bottom"
              data-animation-duration="300"
              data-animation-delay="800"
              data-animation-distance="200px">
            <div class="padding-50 flex-panel">
               <h3 class="font-accident-two-normal uppercase">
               </h3>
               <div class="dividewhite4"></div>
               <div class="experience">
               </div>
               <div class="dividewhite1"></div>
            </div>
         </div>
         <div id="bar-skills" class="col-md-8 flex-column dark nopadding ui-block-color03 flex-col" data-section="bar-skills"
              data-animation-origin="right"
              data-animation-duration="400"
              data-animation-delay="1100"
              data-animation-distance="200px">
            <div class="padding-50 flex-panel">
               <h3 class="font-accident-two-normal uppercase"></h3>
               <div class="dividewhite2"></div>
               <div class="row">
               </div>
            </div>
         </div>
      </div>

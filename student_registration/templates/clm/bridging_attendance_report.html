{% extends "base2.html" %}

{% block main_content %}
<section class="container-fluid" data-section="home">
    <div class="row flex-row">
        <!-- Filters Section -->
        <div id="filters-section" class="col-md-12 flex-column ui-block-color01 light nopadding">
            <div class="row flex-panel nopadding">
                <!-- Filter Panel Left -->
                <div class="col-md-6 flex-column bg-color03 p-grid-item nopadding hvr-bounce-to-top hvr-green">
                    <div class="flex-panel padding-44">
                        <div class="p-icon green"></div>
                        <span class="uppercase">Filters</span>

                        <div class="form-group">
                            <label for="dirasa-month">Select Month</label>
                             <select id="dirasa-month" class="form-control">
                               <option value="">Select Month</option>
                               <option value="01">January</option>
                               <option value="02">February</option>
                               <option value="03">March</option>
                               <option value="04">April</option>
                               <option value="05">May</option>
                               <option value="06">June</option>
                               <option value="07">July</option>
                               <option value="08">August</option>
                               <option value="09">September</option>
                               <option value="10">October</option>
                               <option value="11">November</option>
                               <option value="12">December</option>
                             </select>

                        </div>

                        <div class="form-group">
                            <label for="dirasa-year">Select Year</label>
                            <select id="dirasa-year" class="form-control">
                         <option value="">Select Year</option>
                         <option value="2023">2023</option>
                         <option value="2024">2024</option>
                         <option value="2025">2025</option>
                         <option value="2026">2026</option>
                         <option value="2027">2027</option>
                         <option value="2028">2028</option>
                         <option value="2029">2029</option>
                         <option value="2030">2030</option>
                       </select>
                        </div>

                        <button id="generate-url" class="btn btn-primary btn-block mt-3" onclick="generateAndOpenURL()">Export Raw Attendance</button>
                    </div>
                </div>

                <!-- Filter Panel Right -->
                <div class="col-md-6 flex-column bg-color03 p-grid-item nopadding hvr-bounce-to-top hvr-blue">
                    <div class="flex-panel padding-44">
                        <div class="p-icon green"></div>
                        <span class="uppercase">Filters</span>
                        <div class="form-group">
                            <label for="dirasa-round">Select Round</label>
                            <select id="dirasa-round" class="form-control">
                                <option value="">Select Round</option>
                                {% for round in rounds %}
                                    <option value="{{ round.id }}">{{ round.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <button id="generate-total-url" class="btn btn-primary btn-block mt-3" onclick="generateAndOpenTotalURL()">Export Total Attendances</button>
                        <button id="generate-round-url" class="btn btn-primary btn-block mt-3" onclick="generateAndOpenConsecutiveURL()">Export Consecutive Absence</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
function generateAndOpenURL() {
    var month = document.getElementById('dirasa-month').value;
    var year = document.getElementById('dirasa-year').value;

    if (month && year) {
        var url = `/attendances/attendance-export/${month}/${year}/`;
        window.location.href = url;
    } else {
        alert('Please select both month and year.');
    }
}

function generateAndOpenTotalURL() {
    var round = document.getElementById('dirasa-round').value;

    if (round) {
        window.location.href = "{% url 'attendances:total_attendance_export' %}?round=" + round;
    } else {
        alert('Round is not selected. Please select a round before exporting data.');
    }
}

function generateAndOpenConsecutiveURL() {
    var round = document.getElementById('dirasa-round').value;

    if (round) {
        window.location.href = "{% url 'attendances:consecutive_attendance_export' %}?round=" + round;
    } else {
        alert('Round is not selected. Please select a round before exporting data.');
    }
}
</script>
{% endblock %}

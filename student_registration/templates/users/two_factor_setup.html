{% extends "base.html" %}
{% block content %}
<h2>Setup Two-Factor Authentication</h2>
<p>Use Google Authenticator to scan the QR code below and then enter the 6-digit code.</p>
<img src="https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl={{ qr_url }}" alt="QR Code">
<p>Secret: {{ secret }}</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Verify</button>
</form>
{% endblock %}

{% extends "base.html" %}
{% load static i18n %}

{% block extra_head %}
<style>
    #chart {
        width: 100%;
        height: 400px;
    }
    #legend {
        margin-top: 10px;
    }
    .legend-item {
        display: inline-flex;
        align-items: center;
        margin-right: 10px;
    }
    .legend-color {
        width: 12px;
        height: 12px;
        margin-right: 4px;
        display: inline-block;
    }
    .tooltip {
        position: absolute;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        pointer-events: none;
        font-size: 12px;
        border-radius: 4px;
    }
</style>
{% endblock %}

{% block content %}
<section class="main-content-wrapper">
    <section id="main-content">
        <div class="title_left">
            <h3>{% trans "Chart Builder" %}</h3>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-4">
                <form id="chart-form">
                    <div class="form-group">
                        <label for="chart-type">{% trans "Chart Type" %}</label>
                        <select id="chart-type" class="form-control">
                            <option value="bar">{% trans "Bar" %}</option>
                            <option value="line">{% trans "Line" %}</option>
                            <option value="pie">{% trans "Pie" %}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mscc-data-type">{% trans "MSCC Data Source" %}</label>
                        <select id="mscc-data-type" class="form-control">
                            <option value="nationality">{% trans "By Nationality" %}</option>
                            <option value="gender">{% trans "By Gender" %}</option>
                        </select>
                        <button type="button" id="load-mscc-data" class="btn btn-secondary mt-2">{% trans "Load MSCC Data" %}</button>
                    </div>
                    <div class="form-group">
                        <label>{% trans "Filters" %}</label>
                        <input id="filter-package_type" type="text" class="form-control mb-2" placeholder="{% trans 'Package Type' %}">
                        <input id="filter-partner" type="text" class="form-control mb-2" placeholder="{% trans 'Partner' %}">
                        <input id="filter-round" type="text" class="form-control mb-2" placeholder="{% trans 'Round' %}">
                        <input id="filter-center" type="text" class="form-control mb-2" placeholder="{% trans 'Center' %}">
                        <input id="filter-governorate" type="text" class="form-control mb-2" placeholder="{% trans 'Governorate' %}">
                        <input id="filter-caza" type="text" class="form-control mb-2" placeholder="{% trans 'Caza' %}">
                        <input id="filter-cadaster" type="text" class="form-control mb-2" placeholder="{% trans 'Cadaster' %}">
                        <input id="filter-programme_type" type="text" class="form-control mb-2" placeholder="{% trans 'Programme Type' %}">
                        <input id="filter-start" type="date" class="form-control mb-2" placeholder="{% trans 'Start Date' %}">
                        <input id="filter-end" type="date" class="form-control mb-2" placeholder="{% trans 'End Date' %}">
                    </div>
                    <div class="form-group">
                        <label for="chart-data">{% trans "Data (JSON)" %}</label>
                        <textarea id="chart-data" class="form-control" rows="5">[
{"label": "A", "value": 30},
{"label": "B", "value": 80},
{"label": "C", "value": 45}
]</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">{% trans "Render" %}</button>
                </form>
            </div>
            <div class="col-md-8">
                <svg id="chart"></svg>
                <div id="legend"></div>
            </div>
        </div>
    </section>
</section>
{% endblock %}

{% block extra_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="{% static 'js/chart_builder.js' %}"></script>
{% endblock %}

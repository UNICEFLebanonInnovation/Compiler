{% extends "base.html" %}
{% load static i18n %}

{% block extra_head %}
<style>
    .chart-wrapper {
        margin-bottom: 30px;
    }
    .chart-wrapper svg {
        width: 100%;
        height: 400px;
    }
    .chart-legend {
        margin-top: 10px;
    }
    .legend-item {
        display: inline-flex;
        align-items: center;
        margin-right: 10px;
    }
    .legend-color {
        width: 12px;
        height: 12px;
        margin-right: 4px;
        display: inline-block;
    }
    .chart-loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.8);
        padding: 5px 10px;
        border-radius: 4px;
        display: none;
    }
    .chart-wrapper {
        position: relative;
    }
    .chart-wrapper.fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        z-index: 1050;
        padding: 20px;
        overflow: auto;
    }
    .chart-wrapper.fullscreen svg {
        height: 80vh;
    }
    body.no-scroll {
        overflow: hidden;
    }
    #loading-indicator {
        display: none;
    }
    .tooltip {
        position: absolute;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        pointer-events: none;
        font-size: 12px;
        border-radius: 4px;
    }
</style>
{% endblock %}

{% block content %}
<section class="main-content-wrapper">
    <section id="main-content">
        <div class="title_left">
            <h3>{% trans "Chart Builder" %}</h3>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-12">
                <form id="chart-form" class="mb-4">
                    <div class="form-group">
                        <label for="chart-type">{% trans "Chart Type" %}</label>
                        <select id="chart-type" class="form-control">
                            <option value="bar">{% trans "Bar" %}</option>
                            <option value="line">{% trans "Line" %}</option>
                            <option value="pie">{% trans "Pie" %}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mscc-data-type">{% trans "MSCC Data Source" %}</label>
                        <select id="mscc-data-type" class="form-control mb-2">
                            <option value="nationality">{% trans "By Nationality" %}</option>
                            <option value="gender">{% trans "By Gender" %}</option>
                            <option value="package_type">{% trans "By Package Type" %}</option>
                            <option value="partner">{% trans "By Partner" %}</option>
                            <option value="round">{% trans "By Round" %}</option>
                            <option value="center">{% trans "By Center" %}</option>
                            <option value="governorate">{% trans "By Governorate" %}</option>
                            <option value="caza">{% trans "By Caza" %}</option>
                            <option value="district">{% trans "By District" %}</option>
                            <option value="programme_type">{% trans "By Programme Type" %}</option>
                        </select>
                        <div id="mscc-filters">
                        <select id="filter-package_type" class="form-control mb-2">
                            <option value="">{% trans 'Package Type' %}</option>
                            {% for key, label in package_types %}
                            <option value="{{ key }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                        <select id="filter-partner" class="form-control mb-2">
                            <option value="">{% trans 'Partner' %}</option>
                            {% for partner in partners %}
                            <option value="{{ partner.id }}">{{ partner.name }}</option>
                            {% endfor %}
                        </select>
                        <select id="filter-round" class="form-control mb-2">
                            <option value="">{% trans 'Round' %}</option>
                            {% for r in rounds %}
                            <option value="{{ r.id }}">{{ r.name }}</option>
                            {% endfor %}
                        </select>
                        <select id="filter-center" class="form-control mb-2">
                            <option value="">{% trans 'Center' %}</option>
                            {% for c in centers %}
                            <option value="{{ c.id }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>
                        <select id="filter-governorate" class="form-control mb-2">
                            <option value="">{% trans 'Governorate' %}</option>
                            {% for g in governorates %}
                            <option value="{{ g.id }}">{{ g.name }}</option>
                            {% endfor %}
                        </select>
                        <select id="filter-caza" class="form-control mb-2">
                            <option value="">{% trans 'Caza' %}</option>
                            {% for cz in cazas %}
                            <option value="{{ cz.id }}">{{ cz.name }}</option>
                            {% endfor %}
                        </select>
                        <select id="filter-district" class="form-control mb-2">
                            <option value="">{% trans 'District' %}</option>
                            {% for cd in cadasters %}
                            <option value="{{ cd.id }}">{{ cd.name }}</option>
                            {% endfor %}
                        </select>
                        <select id="filter-programme_type" class="form-control mb-2">
                            <option value="">{% trans 'Programme Type' %}</option>
                            {% for key, label in programme_types %}
                            <option value="{{ key }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                        <input id="filter-start" type="date" class="form-control mb-2" placeholder="{% trans 'Start Date' %}">
                        <input id="filter-end" type="date" class="form-control mb-2" placeholder="{% trans 'End Date' %}">
                        </div>
                        <button type="button" id="load-mscc-data" class="btn btn-secondary mt-2">{% trans "Load MSCC Data" %}</button>
                    </div>
                    <div class="form-group">
                        <label for="chart-data">{% trans "Data (JSON)" %}</label>
                        <textarea id="chart-data" class="form-control" rows="5">[
{"label": "A", "value": 30},
{"label": "B", "value": 80},
{"label": "C", "value": 45}
]</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">{% trans "Render" %}</button>
                </form>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="mb-3">
                    <button id="add-chart" type="button" class="btn btn-primary mr-2">{% trans "Add Chart" %}</button>
                    <button id="save-dashboard" type="button" class="btn btn-secondary">{% trans "Save Dashboard" %}</button>
                </div>
                <div id="loading-indicator">{% trans "Loading..." %}</div>
                <div id="charts-container"></div>
            </div>
        </div>
    </section>
</section>
{% endblock %}

{% block extra_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="{% static 'js/chart_builder.js' %}"></script>
{% endblock %}

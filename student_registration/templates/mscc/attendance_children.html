{% load staticfiles i18n %}
{% load static %}
<style>

.attendance_status label.active {
    background-color: #3f6ad8 !important;
    color: white !important;
}

</style>
<ul class="list-group">
{% for item in instances %}
                                            <li class="list-group-item">
                                                <div class="todo-indicator bg-warning"></div>
                                                <div class="widget-content p-0">
                                                    <div class="widget-content-wrapper">
                                                        <div class="widget-content-left mr-3">
                                                          <img width="42" class="rounded-circle" src="{% static 'images/avatars/male.png' %}">
                                                        </div>
                                                        <div class="widget-content-left" style="width: 200px !important;">
                                                            <input type="hidden" class="registry_id" name="registry_id[]" value="{{ item.id }}" />
                                                            <input type="hidden" class="child_id" name="child_id[]" value="{{ item.child.id }}" />
                                                            <div class="widget-heading"><a class="show-child-details" data-toggle="modal" data-target=".bd-example-modal-lg-2" href="{% url 'mscc:child_profile_preview' %}?registry_id={{ item.id }}">{{ item.child.full_name }}</a></div>
                                                            <div class="widget-subheading">{{ item.child.mother_fullname }}</div>
                                                        </div>
                                                        <div class="widget-content-right" style="width: 200px !important;">
                                                            <div class="widget-heading">{{ item.child.birthday }}</div>
                                                            <div class="widget-subheading">{{ item.child.nationality.name }}</div>
                                                        </div>
                                                        <div class="widget-content-right">
                                                            <div role="group" class="btn-group-sm btn-group">

<div class="btn-group btn-group-toggle attendance_status" data-toggle="buttons">
  <label class="btn btn-light active">
    <input type="radio" name="attendance_status[]" class="attendance_status" value="Yes" id="attendance_status_on_{{ item.id }}" autocomplete="off" checked> Attended
  </label>
  <label class="btn btn-light">
    <input type="radio" name="attendance_status[]" class="attendance_status" value="No" id="attendance_status_off_{{ item.id }}" autocomplete="off"> Absent
  </label>
</div>

</div>


<div class="input-group">
                                                <div class="input-group-prepend">
                                    <select id="absence_reason[]" class="btn-primary">
                                        <option value="1">Option 1</option>
                                        <option value="2">Option 2</option>
                                        <option value="3">Option 3</option>
                                        <option value="4">Option 4</option>
                                        <option value="5">Option 5</option>
                                        <option value="6">Option 6</option>
                                    </select>
                                                </div>
                                                <input name="" type="text" class="form-control"></div>

                                                        </div>
                                                        <div class="widget-content-right">
                                                            <div role="group" class="btn-group-sm btn-group">
                                                                <!--<button type="button" class="btn-shadow btn btn-primary">Hire</button>-->
                                                                <!--<button type="button" class="btn-shadow btn btn-primary">Fire</button>-->
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </li>
  {% endfor %}
</ul>

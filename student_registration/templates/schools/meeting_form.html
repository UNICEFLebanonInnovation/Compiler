{% extends "base6.html" %}
{% load staticfiles i18n %}
{% load crispy_forms_tags %}

{% block head_title %}School - Meeting{% endblock %}

{% block extra_head %}
    <!-- Load jQuery first -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Load jQuery UI CSS from the CDN for proper styles -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">

    <!-- Load jQuery UI -->
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <style>
        .ui-datepicker {
            z-index: 9999 !important; /* Ensure datepicker appears on top */
            background-color: white;
            border: 1px solid #ccc;
            padding: 10px;
            font-size: 14px;
        }
    </style>
{% endblock %}

{% block content-full-page %}
<section>
    <div id="resume" class="inner-content">
        <section id="page-title" class="inline-form inner-section ui-menu-color02">
            <div class="container-fluid nopadding">
                <h3 class="font-accident-two-light color01 uppercase"
                    data-animation-origin="right"
                    data-animation-duration="400"
                    data-animation-delay="100"
                    data-animation-distance="50px">{% trans "Meeting" %}</h3>
            </div>
        </section>
        <section class="inline-form inner-section light bg-color01">
            <div class="container-fluid nopadding">
                {{ form.errors }}
                {% crispy form %}
            </div>
        </section>
    </div>
</section>

<script type="text/javascript">
    $(document).ready(function() {
        $(".datepicker").datepicker({
            dateFormat: "yy-mm-dd"
        });
    });
</script>
{% endblock %}

{% load static i18n %}
{% if column.attrs.url %}
<div style="width: 100px;">

  <a href="{{ column.attrs.url }}{{ record.id }}" class="btn btn-primary col-icon">
    <i class="fa fa-list"></i>
  </a>

  {% if not request.user.partner or not request.user.partner.is_world_learning %}
    <a href="{% url 'schools:meeting_add' record.id %}" class="btn btn-success col-icon">
      <i class="fa fa-plus"></i>
    </a>
  {% endif %}

</div>
{% else %}
    {% trans "Not allowed" %}
{% endif %}
